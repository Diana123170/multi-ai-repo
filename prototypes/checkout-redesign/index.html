<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>结算页改版 · 交互原型</title>
  <link rel="stylesheet" href="https://unpkg.com/antd@4.24.15/dist/antd.min.css" />
  <script crossorigin src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/antd@4.24.15/dist/antd.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin: 0; background: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .page { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    .toolbar { margin-bottom: 16px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;
    const { Layout, Card, Steps, Form, Input, Button, Radio, Space, Typography, message, Divider, Segmented } = antd;
    const { Header, Content } = Layout;
    const { Title, Text } = Typography;

    function OnePage() {
      const [pay, setPay] = useState("wechat");
      return (
        <Card title="确认订单">
          <Form layout="vertical">
            <Form.Item label="收货人"><Input defaultValue="张三" /></Form.Item>
            <Form.Item label="手机号"><Input defaultValue="13800000000" /></Form.Item>
            <Form.Item label="支付方式">
              <Radio.Group value={pay} onChange={(e) => setPay(e.target.value)}>
                <Space direction="vertical">
                  <Radio value="wechat">微信支付</Radio>
                  <Radio value="alipay">支付宝</Radio>
                  <Radio value="card">银行卡</Radio>
                </Space>
              </Radio.Group>
            </Form.Item>
            <Divider />
            <Space style={{ width: "100%", justifyContent: "space-between" }}>
              <Text>合计：<Text strong style={{ color: "#cf1322" }}>¥ 128.00</Text></Text>
              <Button type="primary" onClick={() => message.success("已提交（原型演示）")}>
                提交订单
              </Button>
            </Space>
          </Form>
        </Card>
      );
    }

    function Stepper() {
      const [step, setStep] = useState(0);
      return (
        <Card>
          <Steps current={step} style={{ marginBottom: 24 }}>
            <Steps.Step title="填写信息" />
            <Steps.Step title="确认订单" />
            <Steps.Step title="支付" />
          </Steps>
          {step === 0 && (
            <Form layout="vertical">
              <Form.Item label="收货人"><Input defaultValue="张三" /></Form.Item>
              <Form.Item label="手机号"><Input defaultValue="13800000000" /></Form.Item>
            </Form>
          )}
          {step === 1 && <Text>订单：商品 A × 1，合计 ¥ 128.00</Text>}
          {step === 2 && <Text>请选择支付方式并完成支付（原型演示）。</Text>}
          <Divider />
          <Space>
            {step > 0 && <Button onClick={() => setStep(step - 1)}>上一步</Button>}
            {step < 2 ? (
              <Button type="primary" onClick={() => setStep(step + 1)}>下一步</Button>
            ) : (
              <Button type="primary" onClick={() => message.success("支付成功（原型演示）")}>
                支付
              </Button>
            )}
          </Space>
        </Card>
      );
    }

    function App() {
      const [variant, setVariant] = useState("one-page");
      return (
        <Layout style={{ minHeight: "100vh", background: "#f5f5f5" }}>
          <Header style={{ background: "#fff", borderBottom: "1px solid #f0f0f0" }}>
            <Title level={4} style={{ margin: "16px 0" }}>结算页改版 · 原型</Title>
          </Header>
          <Content className="page">
            <div className="toolbar">
              <Segmented
                value={variant}
                onChange={setVariant}
                options={[
                  { label: "单页结算", value: "one-page" },
                  { label: "分步结算", value: "stepper" },
                ]}
              />
            </div>
            {variant === "one-page" ? <OnePage /> : <Stepper />}
          </Content>
        </Layout>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
