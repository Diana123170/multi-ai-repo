# 机器可读的协作规则。pr-guard 读这里做校验，改这里必须走受保护路径的 PR。
version: 1

branches:
  trunk: main
  prototype_prefix: "proto/"
  promote_prefix: "promote/"
  formal_prefixes:
    - "feat/"
    - "fix/"
    - "chore/"
    - "docs/"
    - "refactor/"
    - "perf/"
    - "test/"
    - "build/"
    - "ci/"
    - "plan/"

workspace:
  prototype_root: "prototypes/"
  code_roots:
    - "apps/"
    - "packages/"
    - "services/"

tracks:
  prototype:
    merge_method: squash
    auto_merge: true          # 原型轨 CI 绿即可自动合并
    required_approvals: 0
    required_checks: ["ci", "pr-guard"]
    ttl_days: 30
    max_changed_lines: 800
    max_files: 60

  formal:
    merge_method: squash
    auto_merge: false         # 正式轨必须人审
    required_approvals: 1
    merge_queue: true
    required_checks: ["ci", "pr-guard"]
    max_changed_lines: 400
    max_files: 30

promote:
  min_status: approved        # 只有 approved 的原型才能转正
  max_files: 500

# 这些路径普通 Worker 任务不能碰；任务文件写 allow_protected: true 才行（仅 Planner 任务）
protected_paths:
  - ".github/**"
  - "ai/**"
  - "scripts/**"
  - "docs/adr/**"
  - "Makefile"
